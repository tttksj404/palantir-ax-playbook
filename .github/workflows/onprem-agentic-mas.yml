name: On-prem Agentic MAS checks

on:
  pull_request:
    paths:
      - "examples/onprem-agentic-mas/**"
      - ".github/workflows/onprem-agentic-mas.yml"
  push:
    branches:
      - main
    paths:
      - "examples/onprem-agentic-mas/**"
      - ".github/workflows/onprem-agentic-mas.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Python quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/onprem-agentic-mas
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q
